trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.0'

stages:

# ==========================================
# BUILD
# ==========================================

- stage: Build
  displayName: 'Build - Terraform Validate and Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    # Install Terraform
    - bash: |
        sudo apt-get update
        sudo apt-get install -y unzip

        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

        unzip terraform_$(terraformVersion)_linux_amd64.zip

        sudo mv terraform /usr/local/bin/

        terraform version
      displayName: 'Install Terraform'


    # Terraform Format
    - bash: |
        terraform fmt -check
      displayName: 'Terraform Format Check'


    # Terraform Init
    - bash: |
        terraform init
      displayName: 'Terraform Init'


    # Terraform Validate
    - bash: |
        terraform validate
      displayName: 'Terraform Validate'


    # Terraform Plan
    - bash: |
        terraform plan \
          -var-file="environments/dev.tfvars"
      displayName: 'Terraform Plan'


# ==========================================
# DEV
# ==========================================

- stage: Dev
  displayName: 'Deploy to DEV'

  dependsOn: Build

  condition: succeeded()

  jobs:

  - job: TerraformDev
    displayName: 'Terraform Apply DEV'

    steps:

    - bash: |
        sudo apt-get update
        sudo apt-get install -y unzip wget

        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

        unzip terraform_$(terraformVersion)_linux_amd64.zip

        sudo mv terraform /usr/local/bin/

        terraform version
      displayName: 'Install Terraform'


    - bash: |
        terraform init
      displayName: 'Terraform Init'


    - bash: |
        terraform apply \
          -var-file="environments/dev.tfvars" \
          -auto-approve
      displayName: 'Terraform Apply DEV'


# ==========================================
# PRODUCTION
# ==========================================

- stage: Production
  displayName: 'Deploy to PRODUCTION'

  dependsOn: Dev

  condition: succeeded()

  jobs:

  - deployment: TerraformProduction
    displayName: 'Terraform Apply PRODUCTION'

    environment: terraform-prod

    strategy:
      runOnce:
        deploy:

          steps:

          - bash: |
              sudo apt-get update
              sudo apt-get install -y unzip wget

              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

              unzip terraform_$(terraformVersion)_linux_amd64.zip

              sudo mv terraform /usr/local/bin/

              terraform version
            displayName: 'Install Terraform'


          - bash: |
              terraform init
            displayName: 'Terraform Init'


          - bash: |
              terraform apply \
                -var-file="environments/prod.tfvars" \
                -auto-approve
            displayName: 'Terraform Apply PRODUCTION'