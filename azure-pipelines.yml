trigger:
  - main

# Define the global operating system for your jobs
pool:
  vmImage: 'ubuntu-latest'

stages:
  # 1. BUILD STAGE
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: CompileJob
        steps:
          - script: echo "Restoring dependencies..."
            displayName: 'Restore'
          - script: echo "Compiling code..."
            displayName: 'Compile'

  # 2. TEST STAGE
  - stage: Test
    displayName: 'Run Unit Tests'
    dependsOn: Build # Only runs if the Build stage succeeds
    jobs:
      - job: TestJob
        steps:
          - script: echo "Running automated tests..."
            displayName: 'Run Tests'
